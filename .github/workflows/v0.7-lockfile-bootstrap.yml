name: V0.7 Lockfile Bootstrap

on:
  pull_request:
    branches: [sync/v0.3-final]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate API lockfile
        working-directory: apps/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate web lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package-lock.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git commit -m "build(v0.7): add npm lockfiles"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
