name: Backup Restore Verification

on:
  push:
    branches:
      - 'feat/v0.6-production-reliability'
  pull_request:
    branches:
      - 'sync/v0.3-final'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    name: Encrypted backup and restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: schoolos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d schoolos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/schoolos
      BACKUP_RETENTION_DAYS: 35
      RPO_TARGET_MINUTES: 1440
      RTO_TARGET_MINUTES: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize runner-local backup paths
        run: |
          set -euo pipefail
          echo "BACKUP_DIR=$RUNNER_TEMP/ai-school-os-backups" >> "$GITHUB_ENV"
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run prisma:generate
      - name: Apply migrations
        working-directory: apps/api
        run: npm run prisma:migrate:deploy
      - name: Pin PostgreSQL 16.15 client tools
        run: |
          set -euo pipefail
          for tool in psql pg_dump pg_restore; do
            printf '%s\n' '#!/usr/bin/env bash' "exec docker run --rm --network host -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -v \"$RUNNER_TEMP:$RUNNER_TEMP\" -v /tmp:/tmp postgres:16.15 $tool \"\$@\"" > "$RUNNER_TEMP/$tool-16.15"
            chmod 700 "$RUNNER_TEMP/$tool-16.15"
            "$RUNNER_TEMP/$tool-16.15" --version
          done
          echo "PG_DUMP_BIN=$RUNNER_TEMP/pg_dump-16.15" >> "$GITHUB_ENV"
          echo "PG_RESTORE_BIN=$RUNNER_TEMP/pg_restore-16.15" >> "$GITHUB_ENV"
          echo "PG_PSQL_BIN=$RUNNER_TEMP/psql-16.15" >> "$GITHUB_ENV"
      - name: Create representative restore marker
        run: |
          PGPASSWORD=ci "$PG_PSQL_BIN" "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS backup_restore_sentinel (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO backup_restore_sentinel (id, value) VALUES (1, 'v0.6-restore-ok') ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;"
      - name: Prepare backup secret
        run: |
          set -euo pipefail
          passphrase_file="$RUNNER_TEMP/backup-passphrase"
          umask 077
          openssl rand -hex 32 > "$passphrase_file"
          echo "GPG_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV"
      - name: Create encrypted backup
        run: bash ./scripts/backup-postgres.sh
      - name: Locate backup artifact
        id: backup
        run: |
          set -euo pipefail
          backup_file="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'schoolos-*.dump.gpg' -print -quit)"
          test -n "$backup_file"
          echo "file=$backup_file" >> "$GITHUB_OUTPUT"
      - name: Reset restore database
        run: PGPASSWORD=ci "$PG_PSQL_BIN" "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Execute measurable DR drill
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
          PGPASSWORD: ci
          PG_PSQL_BIN: ${{ runner.temp }}/psql-16.15
          RPO_TARGET_MINUTES: 1440
          RTO_TARGET_MINUTES: 240
          DRILL_RUN_ID: ci-${{ github.run_id }}
        run: bash ./scripts/dr-drill.sh
      - name: Validate restored database structure
        run: |
          set -euo pipefail
          PGPASSWORD=ci "$PG_PSQL_BIN" "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT COUNT(*) FROM _prisma_migrations" | grep -Eq '^[[:space:]]*[1-9][0-9]*[[:space:]]*$'
          PGPASSWORD=ci "$PG_PSQL_BIN" "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'Tenant'" | grep -Fx '1'
