name: CI

on:
  push:
    branches: [main, sync/v0.3-final, feat/v0.6-production-reliability]
  pull_request:
    branches: [main, sync/v0.3-final]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: schoolos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d schoolos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/schoolos
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-32-characters-minimum
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      TRUST_PROXY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run prisma:migrate:deploy
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API production dependencies
        working-directory: apps/api
        run: npm install --omit=dev --no-audit --no-fund
      - name: Audit API production dependencies
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high
      - name: Install web production dependencies
        working-directory: apps/web
        run: npm install --omit=dev --no-audit --no-fund
      - name: Audit web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  backup-restore:
    name: Encrypted backup and restore verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: schoolos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d schoolos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/schoolos
      BACKUP_DIR: ${{ runner.temp }}/ai-school-os-backups
      BACKUP_RETENTION_DAYS: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run prisma:generate
      - name: Apply migrations
        working-directory: apps/api
        run: npm run prisma:migrate:deploy
      - name: Pin PostgreSQL 16.15 client tools
        run: |
          printf '%s\n' '#!/usr/bin/env bash' 'exec docker run --rm --network host -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:16.15 psql "$@"' > "${{ runner.temp }}/psql-16.15"
          printf '%s\n' '#!/usr/bin/env bash' 'exec docker run --rm --network host -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:16.15 pg_dump "$@"' > "${{ runner.temp }}/pg_dump-16.15"
          printf '%s\n' '#!/usr/bin/env bash' 'exec docker run --rm --network host -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:16.15 pg_restore "$@"' > "${{ runner.temp }}/pg_restore-16.15"
          chmod 700 "${{ runner.temp }}/psql-16.15" "${{ runner.temp }}/pg_dump-16.15" "${{ runner.temp }}/pg_restore-16.15"
          "${{ runner.temp }}/psql-16.15" --version
          "${{ runner.temp }}/pg_dump-16.15" --version
          "${{ runner.temp }}/pg_restore-16.15" --version
          echo "PG_DUMP_BIN=${{ runner.temp }}/pg_dump-16.15" >> "$GITHUB_ENV"
          echo "PG_RESTORE_BIN=${{ runner.temp }}/pg_restore-16.15" >> "$GITHUB_ENV"
          echo "PG_PSQL_BIN=${{ runner.temp }}/psql-16.15" >> "$GITHUB_ENV"
      - name: Create restore sentinel
        run: |
          PGPASSWORD=ci "$PG_PSQL_BIN" "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS backup_restore_sentinel (
            id integer PRIMARY KEY,
            value text NOT NULL
          );
          INSERT INTO backup_restore_sentinel (id, value)
          VALUES (1, 'v0.6-restore-ok')
          ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
          SQL
      - name: Prepare backup secret
        run: |
          passphrase_file="${{ runner.temp }}/backup-passphrase"
          umask 077
          openssl rand -hex 32 > "$passphrase_file"
          echo "GPG_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV"
      - name: Create encrypted backup
        run: bash ./scripts/backup-postgres.sh
      - name: Locate backup artifact
        id: backup
        run: |
          backup_file="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'schoolos-*.dump.gpg' -print -quit)"
          test -n "$backup_file"
          echo "file=$backup_file" >> "$GITHUB_OUTPUT"
      - name: Reset restore database
        run: |
          PGPASSWORD=ci "$PG_PSQL_BIN" "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Restore encrypted backup
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
        run: bash ./scripts/restore-postgres.sh
      - name: Validate restored data
        run: |
          PGPASSWORD=ci "$PG_PSQL_BIN" "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT value FROM backup_restore_sentinel WHERE id = 1" | grep -Fx 'v0.6-restore-ok'
          PGPASSWORD=ci "$PG_PSQL_BIN" "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT COUNT(*) FROM _prisma_migrations" | grep -Eq '^[[:space:]]*[1-9][0-9]*[[:space:]]*$'
